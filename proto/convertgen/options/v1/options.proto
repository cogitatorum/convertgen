syntax = "proto3";

package convertgen.options.v1;

option go_package = "github.com/cogitatorum/convertgen/options/v1;optionsv1";

import "google/protobuf/descriptor.proto";

// Field options for fail-closed convertgen policy hints.
// Mapping still requires an explicit convert.yaml entry; options refine behavior.
extend google.protobuf.FieldOptions {
  bool skip = 75000;
  string go_name = 75001;
}

extend google.protobuf.MessageOptions {
  string domain_type = 75010;
}
